<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16120e">
<title>Siatka Powiązań</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Siatka">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap">
<style>body{margin:0}[hidden]{display:none!important}</style>
<style>
/* Layout: one phone-width column — case header, cork board (pins + red string), desk drawer with case file / notebook. Single committed noir look. */
:root{
  --room:#16120e; --desk:#231b15; --desk-edge:#3a2d22;
  --cork:#a3744a; --cork-deep:#7c5433;
  --paper:#ece3cf; --paper-shade:#d9cdb3; --ink:#2b221b; --ink-soft:#6b5d4f;
  --string:#c22a2a; --brass:#d9a648; --stamp:#b3261e; --ok:#3f7a4a;
  --fg:#efe6d4; --muted:#a8998a;
  --f-pixel:"Pixelify Sans", "Courier New", monospace;
  --f-type:"Special Elite", "Courier New", monospace;
  --f-body:"Courier Prime", "Courier New", monospace;
  color-scheme:dark;
  /* sprężyna (linear() z nadbiciem); przeglądarki bez linear() zostają przy cubic-bezier podanym obok */
  --spring-l:linear(0,.009,.035 2.1%,.141,.281 6.7%,.723 12.9%,.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,.991,.977 51%,.974 53.8%,.975 57.1%,.997 69.8%,1.003 76.9%,1.004 83.8%,1);
}
html,body{min-height:100%}
/* gra wypełnia wysokość ekranu; na wysokich ekranach (komputer) jest wyśrodkowana */
body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;background:var(--room);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.app{width:100%;height:100vh;height:100dvh;max-height:1100px;max-width:520px;margin:auto;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:max(10px,env(safe-area-inset-bottom,0px));gap:10px;position:relative}

/* header */
.top{display:flex;flex-direction:column;gap:6px}
.tline{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px}
.top h1{margin:0;font-family:var(--f-pixel);font-weight:700;font-size:22px;letter-spacing:.02em;line-height:1;color:var(--fg)}
.top .case{font-family:var(--f-type);font-size:13px;color:var(--muted);min-width:0}
.meta{display:flex;align-items:center;gap:10px;font-family:var(--f-pixel);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.lives{display:flex;gap:4px}
.lives i{width:10px;height:10px;background:var(--string);display:block;box-shadow:inset -2px -2px 0 rgba(0,0,0,.3)}
.lives i.lost{background:transparent;outline:2px solid var(--desk-edge);outline-offset:-2px;box-shadow:none}

/* board */
.board{position:relative;flex:1 1 auto;min-height:200px;border-radius:4px;overflow:hidden;touch-action:none;
  background:
    radial-gradient(circle at 20% 30%, rgba(0,0,0,.13) 0 1.5px, transparent 2px) 0 0/9px 11px,
    radial-gradient(circle at 70% 60%, rgba(255,230,190,.10) 0 1px, transparent 1.6px) 0 0/7px 8px,
    radial-gradient(circle at 40% 80%, rgba(0,0,0,.10) 0 1px, transparent 1.6px) 0 0/13px 6px,
    radial-gradient(ellipse at 50% 40%, var(--cork) 0%, var(--cork-deep) 120%);
  box-shadow:inset 0 0 0 6px #4a3423, inset 0 0 0 8px #2c1f15, inset 0 0 40px rgba(0,0,0,.45)}
.strings{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.strings .s{fill:none;stroke:var(--string);stroke-width:2.4;stroke-linecap:round;filter:drop-shadow(0 2px 1px rgba(0,0,0,.45))}
.strings .hit{fill:none;stroke:transparent;stroke-width:22;pointer-events:stroke;cursor:pointer}
.strings .tmp{fill:none;stroke:var(--string);stroke-width:2.4;stroke-dasharray:6 5;opacity:.85}
.strings .tmp.on{stroke-dasharray:none;opacity:1}
.strings .cut{animation:cut .28s ease-out forwards}
@keyframes cut{to{opacity:0;stroke-width:0}}

.node{position:absolute;z-index:1;width:84px;padding:6px 6px 0;background:var(--paper);color:var(--ink);border:none;text-align:center;
  box-shadow:0 3px 6px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.08);transform:rotate(var(--r,0deg));transition:transform .15s, filter .2s}
.node:hover{transform:rotate(var(--r,0deg)) translateY(-2px)}
.node.sel{box-shadow:0 0 0 3px var(--brass),0 4px 10px rgba(0,0,0,.55)}
.node .ph{display:block;aspect-ratio:1/1;max-width:100%;background:#2a2622;image-rendering:pixelated}
.node .ph svg{display:block;width:100%;height:100%}
.node.loc .ph,.node.item .ph{background:#3b4a52}
.node .lb{display:block;font-family:var(--f-type);font-size:var(--lbfs,11.5px);line-height:1.15;padding:5px 0 7px;overflow-wrap:normal}
.node.out{filter:grayscale(1) brightness(.78)}
.node.out::after{content:"";position:absolute;inset:6px 6px 26px;background:
  linear-gradient(45deg,transparent 46%,var(--stamp) 46% 54%,transparent 54%),
  linear-gradient(-45deg,transparent 46%,var(--stamp) 46% 54%,transparent 54%);opacity:.9}
.node.unread .lb::before{content:"";position:absolute;top:1px;right:1px;width:7px;height:7px;background:var(--stamp)}

/* pinezka: mała główka, duża strefa dotyku (46 px) */
.pin{position:absolute;z-index:3;width:46px;height:46px;margin:-23px 0 0 -23px;border:none;background:transparent;padding:0;touch-action:none;border-radius:50%}
.pin::before{content:"";position:absolute;left:16px;top:16px;width:14px;height:14px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff3c4 0 2px,var(--brass) 3px,#8a6420 100%);box-shadow:0 2px 2px rgba(0,0,0,.5);
  transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.pin.pending::before{box-shadow:0 0 0 4px rgba(217,166,72,.45),0 2px 2px rgba(0,0,0,.5)}
.pin.snap::before{transform:scale(1.45);box-shadow:0 0 0 4px rgba(194,42,42,.55),0 2px 2px rgba(0,0,0,.5)}
/* „połącz mnie tutaj”: pasujące węzły pulsują */
.pin.can::after{content:"";position:absolute;left:11px;top:11px;width:24px;height:24px;border-radius:50%;border:2px solid var(--brass);opacity:.7;animation:beckon 1.3s ease-out infinite;pointer-events:none}
@keyframes beckon{0%{transform:scale(.55);opacity:.95}100%{transform:scale(1.7);opacity:0}}
.node.can{animation:breathe 1.3s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 3px rgba(217,166,72,.55),0 3px 10px rgba(0,0,0,.5)}}
.node.dim{filter:brightness(.72) saturate(.7)}
.node.out.dim{filter:grayscale(1) brightness(.6)}
/* sprężyste mikroanimacje */
.pin.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(1)}28%{transform:scale(1.5)}52%{transform:scale(.86)}74%{transform:scale(1.08)}100%{transform:scale(1)}}
.node.bump{animation:bump .55s}
@keyframes bump{0%{transform:rotate(var(--r)) scale(1)}25%{transform:rotate(var(--r)) translateY(-4px) scale(1.07)}50%{transform:rotate(var(--r)) scale(.97)}72%{transform:rotate(var(--r)) translateY(-1px) scale(1.02)}100%{transform:rotate(var(--r)) scale(1)}}
.node.nope{animation:nope .38s}
@keyframes nope{20%{transform:rotate(calc(var(--r) - 5deg))}45%{transform:rotate(calc(var(--r) + 4deg))}70%{transform:rotate(calc(var(--r) - 2deg))}100%{transform:rotate(var(--r))}}
.node.squish{animation:squish .45s}
@keyframes squish{0%{transform:rotate(var(--r)) scale(1)}30%{transform:rotate(var(--r)) scale(.9,.94)}65%{transform:rotate(var(--r)) scale(1.04)}100%{transform:rotate(var(--r)) scale(1)}}
.btn,.mode,.chip,.pick,.tab,.ic{transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.btn:active:not(:disabled),.mode:active:not(:disabled),.chip:active,.pick:active,.tab:active,.ic:active{transform:scale(.93);transition-duration:.06s}
.overlay:not([hidden]) .card{animation:rise .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes rise{0%{transform:translateY(48px);opacity:0}60%{transform:translateY(-6px);opacity:1}80%{transform:translateY(2px)}100%{transform:none}}
.sheet.flip{animation:flip .32s ease-out}
@keyframes flip{0%{opacity:.25;transform:translateY(6px)}100%{opacity:1;transform:none}}
.lives i.pop{animation:pop .5s}
@supports (transition-timing-function:linear(0,1)){.pin::before,.btn,.mode,.chip,.pick,.tab,.ic{transition-timing-function:var(--spring-l)}}
.overlay:not([hidden]) .card.shake{animation:shake .35s}

.hint-toast{position:absolute;left:12px;right:12px;bottom:12px;z-index:4;background:var(--paper);color:var(--ink);font-family:var(--f-type);font-size:13.5px;padding:10px 12px;box-shadow:0 4px 12px rgba(0,0,0,.5);transform:rotate(-.6deg)}
.hint-toast b{font-family:var(--f-pixel);font-weight:600;color:var(--stamp);display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}

/* desk drawer */
.desk{flex:0 0 auto;background:var(--desk);border-top:3px solid var(--desk-edge);border-radius:4px;display:flex;flex-direction:column;gap:10px;padding:10px}
.tabs{display:flex;gap:6px}
.tab{flex:1;background:transparent;border:2px solid var(--desk-edge);padding:6px 8px;font-family:var(--f-pixel);font-size:14px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--desk-edge);color:var(--fg)}
.sheet{background:var(--paper);color:var(--ink);padding:12px 14px;height:clamp(96px,24vh,320px);height:clamp(96px,24dvh,320px);overflow:auto;font-family:var(--f-type);font-size:14px;line-height:1.5;
  background-image:repeating-linear-gradient(transparent 0 22px, rgba(90,120,160,.16) 22px 23px);background-position:0 8px}
.sheet h2{margin:0 0 2px;font-family:var(--f-pixel);font-weight:600;font-size:17px;line-height:1.2;text-wrap:balance}
.sheet .kind{font-family:var(--f-body);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px}
.sheet ul,.sheet ol{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.sheet p{margin:6px 0 0}
.sheet .how{font-family:var(--f-body);font-size:12.5px;color:var(--ink-soft);border-top:1px dashed var(--paper-shade);margin-top:10px;padding-top:8px}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{border:2px solid var(--ink);background:transparent;color:var(--ink);padding:4px 10px;font-family:var(--f-pixel);font-size:13px}
.chip.on{background:var(--ink);color:var(--paper)}

.actions{display:flex;gap:8px}
.btn{flex:1;border:none;padding:11px 10px;font-family:var(--f-pixel);font-weight:600;font-size:15px;letter-spacing:.02em;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3)}
.btn.ghost{background:var(--desk-edge);color:var(--fg)}
.btn.red{background:var(--stamp);color:#fff4ea}
.btn:disabled{opacity:.45;cursor:default}

/* overlays */
.overlay{position:fixed;inset:0;z-index:10;background:rgba(10,8,6,.78);display:flex;align-items:flex-end;justify-content:center;padding:12px max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{width:100%;max-width:488px;max-height:100%;overflow:auto;background:var(--paper);color:var(--ink);padding:16px;font-family:var(--f-type);box-shadow:0 10px 30px rgba(0,0,0,.6)}
.card h3{margin:0 0 4px;font-family:var(--f-pixel);font-size:20px;font-weight:700;text-wrap:balance}
.card .lbl{font-family:var(--f-body);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin:12px 0 6px}
.card .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pick{border:2px solid var(--ink);background:transparent;color:var(--ink);padding:8px;font-family:var(--f-type);font-size:14px;text-align:left}
.pick.on{background:var(--ink);color:var(--paper)}
.card .foot{display:flex;gap:8px;margin-top:14px}
.card .msg{min-height:1.4em;margin-top:10px;color:var(--stamp);font-size:14px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.stamp{display:inline-block;font-family:var(--f-pixel);font-weight:700;font-size:22px;letter-spacing:.08em;color:var(--stamp);border:3px solid var(--stamp);padding:2px 10px;transform:rotate(-4deg);margin:4px 0 8px}
.stamp.ok{color:var(--ok);border-color:var(--ok)}
.stamp{animation:slam .55s cubic-bezier(.34,1.56,.64,1) .15s both}
@keyframes slam{0%{transform:rotate(-4deg) scale(2.4);opacity:0}55%{transform:rotate(-4deg) scale(.9);opacity:1}78%{transform:rotate(-4deg) scale(1.04)}100%{transform:rotate(-4deg) scale(1)}}
/* mikrofakty w aktach i notatniku */
.fx{font-weight:700}
.fx-t{color:#8e1d1d;font-family:var(--f-body);letter-spacing:-.01em}
.fx-l{background:linear-gradient(transparent 58%,rgba(217,166,72,.42) 58% 92%,transparent 92%);padding:0 1px}
.fx-k{text-decoration:underline;text-decoration-color:rgba(43,34,27,.45);text-underline-offset:2px}
.fx-v{font-variant:small-caps}
/* przyciski-ikony w nagłówku */
.tools{display:flex;gap:4px}
.ic{width:28px;height:28px;display:grid;place-items:center;padding:0;background:transparent;border:2px solid var(--desk-edge);color:var(--muted)}
.ic:hover{color:var(--fg);border-color:var(--muted)}
.ic[aria-pressed="true"]{color:var(--brass)}
.ic svg{width:16px;height:16px;display:block;shape-rendering:crispEdges}
.why{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.stars{font-family:var(--f-pixel);font-size:26px;color:var(--brass);letter-spacing:4px}
.share{white-space:pre;font-family:var(--f-body);font-size:13px;background:var(--paper-shade);padding:10px;margin-top:8px;overflow-x:auto;user-select:all}
.stat{font-family:var(--f-body);font-size:13px;color:var(--ink-soft);margin-top:6px}
.epi{font-size:14.5px;margin:6px 0 0;padding:10px 12px;background:var(--paper-shade);border-left:3px solid var(--stamp)}
.quip{font-family:var(--f-body);font-style:italic;font-size:13px;color:var(--ink-soft);margin:12px 0 0}
.modes{display:flex;gap:6px}
.mode{white-space:nowrap;background:transparent;border:2px solid var(--desk-edge);color:var(--muted);font-family:var(--f-pixel);font-size:12px;padding:3px 8px}
.mode:hover{color:var(--fg);border-color:var(--muted)}
.mode:disabled{opacity:.45;cursor:default;color:var(--muted);border-color:var(--desk-edge)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts .chip{font-size:13px;padding:5px 9px}
.opts .chip small{font-family:var(--f-body);font-size:11px;opacity:.75;margin-left:4px}
.card .sub{font-family:var(--f-body);font-size:13px;color:var(--ink-soft);margin:0}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:400px){.top h1{font-size:19px}}
@media (max-width:370px){.top h1{font-size:17px}.meta{gap:7px}}
/* niskie ekrany: ciaśniej, żeby tablica miała więcej miejsca */
@media (max-height:720px){.app{gap:7px}.top{gap:4px}.desk{gap:7px;padding:8px}.tab{padding:4px 8px}.btn{padding:9px 10px}.sheet{padding:10px 12px;height:clamp(84px,20vh,320px);height:clamp(84px,20dvh,320px)}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="tline">
      <h1>Siatka Powiązań</h1>
      <div class="meta"><span id="clock">0:00</span><span class="lives" id="lives" aria-label="Pozostałe oskarżenia"><i></i><i></i><i></i></span>
        <span class="tools"><button class="ic" id="fsBtn" hidden></button><button class="ic" id="sfxBtn"></button><button class="ic" id="musBtn"></button></span></div>
    </div>
    <div class="tline">
      <div class="case" id="caseLine">Ładowanie sprawy…</div>
      <div class="modes"><button class="mode" id="dailyBtn">Sprawa dnia</button><button class="mode" id="newBtn">Nowa sprawa</button></div>
    </div>
  </header>

  <main class="board" id="board" aria-label="Tablica korkowa">
    <svg class="strings" id="strings"></svg>
    <div class="hint-toast" id="toast" hidden></div>
  </main>

  <section class="desk">
    <div class="tabs" role="tablist">
      <button class="tab" id="tab-akta" role="tab" aria-selected="true">Akta</button>
      <button class="tab" id="tab-notes" role="tab" aria-selected="false">Notatnik</button>
    </div>
    <div class="sheet" id="sheet" tabindex="0"></div>
    <div class="actions">
      <button class="btn ghost" id="hintBtn">Podpowiedź (3)</button>
      <button class="btn red" id="accuseBtn">Oskarż</button>
    </div>
  </section>

  <div class="overlay" id="accuse" hidden>
    <div class="card" id="accuseCard">
      <h3>Akt oskarżenia</h3>
      <div class="lbl">Sprawca</div>
      <div class="grid" id="pickWho"></div>
      <div class="lbl" id="toolLbl">Narzędzie zbrodni</div>
      <div class="grid" id="pickWhat"></div>
      <div class="msg" id="accuseMsg"></div>
      <div class="foot">
        <button class="btn ghost" id="accuseCancel">Wróć do tablicy</button>
        <button class="btn red" id="accuseGo" disabled>Wnieś oskarżenie</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="newCase" hidden>
    <div class="card">
      <h3>Nowa sprawa</h3>
      <p class="sub">Wybierz miasto, rok i wielkość śledztwa. „Losowo” zostawia wybór generatorowi.</p>
      <div class="lbl">Miasto</div>
      <div class="opts" id="optCity"></div>
      <div class="lbl">Rok</div>
      <div class="opts" id="optYear"></div>
      <div class="lbl">Wielkość</div>
      <div class="opts" id="optSize"></div>
      <div class="foot">
        <button class="btn ghost" id="newCancel">Anuluj</button>
        <button class="btn red" id="newGo">Otwórz sprawę</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="result" hidden>
    <div class="card" id="resultCard"></div>
  </div>
</div>
<script src="engine/sprites.js"></script>
<script src="engine/engine.js"></script>
<script src="data/base.js"></script>
<script src="data/cities.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
