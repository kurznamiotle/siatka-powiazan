<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16120e">
<title>Siatka Powiązań</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Siatka">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap">
<style>body{margin:0}[hidden]{display:none!important}</style>
<style>
/* Layout: one phone-width column — case header, cork board (pins + red string), desk drawer with case file / notebook. Single committed noir look. */
:root{
  --room:#16120e; --desk:#231b15; --desk-edge:#3a2d22;
  --cork:#a3744a; --cork-deep:#7c5433;
  --paper:#ece3cf; --paper-shade:#d9cdb3; --ink:#2b221b; --ink-soft:#6b5d4f;
  --string:#c22a2a; --brass:#d9a648; --stamp:#b3261e; --ok:#3f7a4a;
  --fg:#efe6d4; --muted:#a8998a;
  --f-pixel:"Pixelify Sans", "Courier New", monospace;
  --f-type:"Special Elite", "Courier New", monospace;
  --f-body:"Courier Prime", "Courier New", monospace;
  color-scheme:dark;
  /* sprężyna (linear() z nadbiciem); przeglądarki bez linear() zostają przy cubic-bezier podanym obok */
  --spring-l:linear(0,.009,.035 2.1%,.141,.281 6.7%,.723 12.9%,.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,.991,.977 51%,.974 53.8%,.975 57.1%,.997 69.8%,1.003 76.9%,1.004 83.8%,1);
}
html,body{min-height:100%}
/* gra wypełnia wysokość ekranu; na wysokich ekranach (komputer) jest wyśrodkowana */
body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;background:var(--room);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.app{width:100%;height:100vh;height:100dvh;max-height:1100px;max-width:520px;margin:auto;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:max(10px,env(safe-area-inset-bottom,0px));gap:10px;position:relative}

/* header */
.top{display:flex;flex-direction:column;gap:6px}
.tline{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px}
.top h1{margin:0;font-family:var(--f-pixel);font-weight:700;font-size:22px;letter-spacing:.02em;line-height:1;color:var(--fg)}
.top .case{font-family:var(--f-type);font-size:13px;color:var(--muted);min-width:0}
.meta{display:flex;align-items:center;gap:10px;font-family:var(--f-pixel);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.lives{display:flex;gap:4px}
.lives i{width:10px;height:10px;background:var(--string);display:block;box-shadow:inset -2px -2px 0 rgba(0,0,0,.3)}
.lives i.lost{background:transparent;outline:2px solid var(--desk-edge);outline-offset:-2px;box-shadow:none}

/* board */
.board{position:relative;flex:1 1 auto;min-height:200px;border-radius:4px;overflow:hidden;touch-action:none;
  background:
    radial-gradient(circle at 20% 30%, rgba(0,0,0,.13) 0 1.5px, transparent 2px) 0 0/9px 11px,
    radial-gradient(circle at 70% 60%, rgba(255,230,190,.10) 0 1px, transparent 1.6px) 0 0/7px 8px,
    radial-gradient(circle at 40% 80%, rgba(0,0,0,.10) 0 1px, transparent 1.6px) 0 0/13px 6px,
    radial-gradient(ellipse at 50% 40%, var(--cork) 0%, var(--cork-deep) 120%);
  box-shadow:inset 0 0 0 6px #4a3423, inset 0 0 0 8px #2c1f15, inset 0 0 40px rgba(0,0,0,.45)}
.strings{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.strings .s{fill:none;stroke:var(--string);stroke-width:2.4;stroke-linecap:round;filter:drop-shadow(0 2px 1px rgba(0,0,0,.45))}
.strings .hit{fill:none;stroke:transparent;stroke-width:22;pointer-events:stroke;cursor:pointer}
.strings .tmp{fill:none;stroke:var(--string);stroke-width:2.4;stroke-dasharray:6 5;opacity:.85}
.strings .tmp.on{stroke-dasharray:none;opacity:1}
.strings .cut{animation:cut .28s ease-out forwards}
@keyframes cut{to{opacity:0;stroke-width:0}}

.node{position:absolute;z-index:1;width:84px;padding:6px 6px 0;background:var(--paper);color:var(--ink);border:none;text-align:center;
  box-shadow:0 3px 6px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.08);transform:rotate(var(--r,0deg));transition:transform .15s, filter .2s}
.node:hover{transform:rotate(var(--r,0deg)) translateY(-2px)}
.node.sel{box-shadow:0 0 0 3px var(--brass),0 4px 10px rgba(0,0,0,.55)}
.node .ph{display:block;aspect-ratio:1/1;max-width:100%;background:#2a2622;image-rendering:pixelated}
.node .ph svg{display:block;width:100%;height:100%}
.node.loc .ph,.node.item .ph{background:#3b4a52}
.node .lb{display:block;font-family:var(--f-type);font-size:var(--lbfs,11.5px);line-height:1.15;padding:5px 0 7px;overflow-wrap:normal}
.node.out{filter:grayscale(1) brightness(.78)}
.node.out::after{content:"";position:absolute;inset:6px 6px 26px;background:
  linear-gradient(45deg,transparent 46%,var(--stamp) 46% 54%,transparent 54%),
  linear-gradient(-45deg,transparent 46%,var(--stamp) 46% 54%,transparent 54%);opacity:.9}
.node.unread .lb::before{content:"";position:absolute;top:1px;right:1px;width:7px;height:7px;background:var(--stamp)}

/* pinezka: mała główka, duża strefa dotyku (46 px) */
.pin{position:absolute;z-index:3;width:46px;height:46px;margin:-23px 0 0 -23px;border:none;background:transparent;padding:0;touch-action:none;border-radius:50%}
.pin::before{content:"";position:absolute;left:16px;top:16px;width:14px;height:14px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff3c4 0 2px,var(--brass) 3px,#8a6420 100%);box-shadow:0 2px 2px rgba(0,0,0,.5);
  transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.pin.pending::before{box-shadow:0 0 0 4px rgba(217,166,72,.45),0 2px 2px rgba(0,0,0,.5)}
.pin.snap::before{transform:scale(1.45);box-shadow:0 0 0 4px rgba(194,42,42,.55),0 2px 2px rgba(0,0,0,.5)}
/* „połącz mnie tutaj”: pasujące węzły pulsują */
.pin.can::after{content:"";position:absolute;left:11px;top:11px;width:24px;height:24px;border-radius:50%;border:2px solid var(--brass);opacity:.7;animation:beckon 1.3s ease-out infinite;pointer-events:none}
@keyframes beckon{0%{transform:scale(.55);opacity:.95}100%{transform:scale(1.7);opacity:0}}
.node.can{animation:breathe 1.3s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 3px rgba(217,166,72,.55),0 3px 10px rgba(0,0,0,.5)}}
.node.dim{filter:brightness(.72) saturate(.7)}
.node.out.dim{filter:grayscale(1) brightness(.6)}
/* sprężyste mikroanimacje */
.pin.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(1)}28%{transform:scale(1.5)}52%{transform:scale(.86)}74%{transform:scale(1.08)}100%{transform:scale(1)}}
.node.bump{animation:bump .55s}
@keyframes bump{0%{transform:rotate(var(--r)) scale(1)}25%{transform:rotate(var(--r)) translateY(-4px) scale(1.07)}50%{transform:rotate(var(--r)) scale(.97)}72%{transform:rotate(var(--r)) translateY(-1px) scale(1.02)}100%{transform:rotate(var(--r)) scale(1)}}
.node.nope{animation:nope .38s}
@keyframes nope{20%{transform:rotate(calc(var(--r) - 5deg))}45%{transform:rotate(calc(var(--r) + 4deg))}70%{transform:rotate(calc(var(--r) - 2deg))}100%{transform:rotate(var(--r))}}
.node.squish{animation:squish .45s}
@keyframes squish{0%{transform:rotate(var(--r)) scale(1)}30%{transform:rotate(var(--r)) scale(.9,.94)}65%{transform:rotate(var(--r)) scale(1.04)}100%{transform:rotate(var(--r)) scale(1)}}
.btn,.mode,.chip,.pick,.tab,.ic{transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.btn:active:not(:disabled),.mode:active:not(:disabled),.chip:active,.pick:active,.tab:active,.ic:active{transform:scale(.93);transition-duration:.06s}
.overlay:not([hidden]) .card{animation:rise .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes rise{0%{transform:translateY(48px);opacity:0}60%{transform:translateY(-6px);opacity:1}80%{transform:translateY(2px)}100%{transform:none}}
.sheet.flip{animation:flip .32s ease-out}
@keyframes flip{0%{opacity:.25;transform:translateY(6px)}100%{opacity:1;transform:none}}
.lives i.pop{animation:pop .5s}
@supports (transition-timing-function:linear(0,1)){.pin::before,.btn,.mode,.chip,.pick,.tab,.ic{transition-timing-function:var(--spring-l)}}
.overlay:not([hidden]) .card.shake{animation:shake .35s}

.hint-toast{position:absolute;left:12px;right:12px;bottom:12px;z-index:4;background:var(--paper);color:var(--ink);font-family:var(--f-type);font-size:13.5px;padding:10px 12px;box-shadow:0 4px 12px rgba(0,0,0,.5);transform:rotate(-.6deg)}
.hint-toast b{font-family:var(--f-pixel);font-weight:600;color:var(--stamp);display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}

/* desk drawer */
.desk{flex:0 0 auto;background:var(--desk);border-top:3px solid var(--desk-edge);border-radius:4px;display:flex;flex-direction:column;gap:10px;padding:10px}
.tabs{display:flex;gap:6px}
.tab{flex:1;background:transparent;border:2px solid var(--desk-edge);padding:6px 8px;font-family:var(--f-pixel);font-size:14px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--desk-edge);color:var(--fg)}
.sheet{background:var(--paper);color:var(--ink);padding:12px 14px;height:clamp(96px,24vh,320px);height:clamp(96px,24dvh,320px);overflow:auto;font-family:var(--f-type);font-size:14px;line-height:1.5;
  background-image:repeating-linear-gradient(transparent 0 22px, rgba(90,120,160,.16) 22px 23px);background-position:0 8px}
.sheet h2{margin:0 0 2px;font-family:var(--f-pixel);font-weight:600;font-size:17px;line-height:1.2;text-wrap:balance}
.sheet .kind{font-family:var(--f-body);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px}
.sheet ul,.sheet ol{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.sheet p{margin:6px 0 0}
.sheet .how{font-family:var(--f-body);font-size:12.5px;color:var(--ink-soft);border-top:1px dashed var(--paper-shade);margin-top:10px;padding-top:8px}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{border:2px solid var(--ink);background:transparent;color:var(--ink);padding:4px 10px;font-family:var(--f-pixel);font-size:13px}
.chip.on{background:var(--ink);color:var(--paper)}

.actions{display:flex;gap:8px}
.btn{flex:1;border:none;padding:11px 10px;font-family:var(--f-pixel);font-weight:600;font-size:15px;letter-spacing:.02em;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3)}
.btn.ghost{background:var(--desk-edge);color:var(--fg)}
.btn.red{background:var(--stamp);color:#fff4ea}
.btn:disabled{opacity:.45;cursor:default}

/* overlays */
.overlay{position:fixed;inset:0;z-index:10;background:rgba(10,8,6,.78);display:flex;align-items:flex-end;justify-content:center;padding:12px max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{width:100%;max-width:488px;max-height:100%;overflow:auto;background:var(--paper);color:var(--ink);padding:16px;font-family:var(--f-type);box-shadow:0 10px 30px rgba(0,0,0,.6)}
.card h3{margin:0 0 4px;font-family:var(--f-pixel);font-size:20px;font-weight:700;text-wrap:balance}
.card .lbl{font-family:var(--f-body);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin:12px 0 6px}
.card .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pick{border:2px solid var(--ink);background:transparent;color:var(--ink);padding:8px;font-family:var(--f-type);font-size:14px;text-align:left}
.pick.on{background:var(--ink);color:var(--paper)}
.card .foot{display:flex;gap:8px;margin-top:14px}
.card .msg{min-height:1.4em;margin-top:10px;color:var(--stamp);font-size:14px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.stamp{display:inline-block;font-family:var(--f-pixel);font-weight:700;font-size:22px;letter-spacing:.08em;color:var(--stamp);border:3px solid var(--stamp);padding:2px 10px;transform:rotate(-4deg);margin:4px 0 8px}
.stamp.ok{color:var(--ok);border-color:var(--ok)}
.stamp{animation:slam .55s cubic-bezier(.34,1.56,.64,1) .15s both}
@keyframes slam{0%{transform:rotate(-4deg) scale(2.4);opacity:0}55%{transform:rotate(-4deg) scale(.9);opacity:1}78%{transform:rotate(-4deg) scale(1.04)}100%{transform:rotate(-4deg) scale(1)}}
/* mikrofakty w aktach i notatniku */
.fx{font-weight:700}
.fx-t{color:#8e1d1d;font-family:var(--f-body);letter-spacing:-.01em}
.fx-l{background:linear-gradient(transparent 58%,rgba(217,166,72,.42) 58% 92%,transparent 92%);padding:0 1px}
.fx-k{text-decoration:underline;text-decoration-color:rgba(43,34,27,.45);text-underline-offset:2px}
.fx-v{font-variant:small-caps}
/* przyciski-ikony w nagłówku */
.tools{display:flex;gap:4px}
.ic{width:28px;height:28px;display:grid;place-items:center;padding:0;background:transparent;border:2px solid var(--desk-edge);color:var(--muted)}
.ic:hover{color:var(--fg);border-color:var(--muted)}
.ic[aria-pressed="true"]{color:var(--brass)}
.ic svg{width:16px;height:16px;display:block;shape-rendering:crispEdges}
.why{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.stars{font-family:var(--f-pixel);font-size:26px;color:var(--brass);letter-spacing:4px}
.share{white-space:pre;font-family:var(--f-body);font-size:13px;background:var(--paper-shade);padding:10px;margin-top:8px;overflow-x:auto;user-select:all}
.stat{font-family:var(--f-body);font-size:13px;color:var(--ink-soft);margin-top:6px}
.epi{font-size:14.5px;margin:6px 0 0;padding:10px 12px;background:var(--paper-shade);border-left:3px solid var(--stamp)}
.quip{font-family:var(--f-body);font-style:italic;font-size:13px;color:var(--ink-soft);margin:12px 0 0}
.modes{display:flex;gap:6px}
.mode{white-space:nowrap;background:transparent;border:2px solid var(--desk-edge);color:var(--muted);font-family:var(--f-pixel);font-size:12px;padding:3px 8px}
.mode:hover{color:var(--fg);border-color:var(--muted)}
.mode:disabled{opacity:.45;cursor:default;color:var(--muted);border-color:var(--desk-edge)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts .chip{font-size:13px;padding:5px 9px}
.opts .chip small{font-family:var(--f-body);font-size:11px;opacity:.75;margin-left:4px}
.card .sub{font-family:var(--f-body);font-size:13px;color:var(--ink-soft);margin:0}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:400px){.top h1{font-size:19px}}
@media (max-width:370px){.top h1{font-size:17px}.meta{gap:7px}}
/* niskie ekrany: ciaśniej, żeby tablica miała więcej miejsca */
@media (max-height:720px){.app{gap:7px}.top{gap:4px}.desk{gap:7px;padding:8px}.tab{padding:4px 8px}.btn{padding:9px 10px}.sheet{padding:10px 12px;height:clamp(84px,20vh,320px);height:clamp(84px,20dvh,320px)}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="tline">
      <h1>Siatka Powiązań</h1>
      <div class="meta"><span id="clock">0:00</span><span class="lives" id="lives" aria-label="Pozostałe oskarżenia"><i></i><i></i><i></i></span>
        <span class="tools"><button class="ic" id="fsBtn" hidden></button><button class="ic" id="sfxBtn"></button><button class="ic" id="musBtn"></button></span></div>
    </div>
    <div class="tline">
      <div class="case" id="caseLine">Ładowanie sprawy…</div>
      <div class="modes"><button class="mode" id="dailyBtn">Sprawa dnia</button><button class="mode" id="newBtn">Nowa sprawa</button><button class="mode" id="howtoBtn">Jak grać</button></div>
    </div>
  </header>

  <main class="board" id="board" aria-label="Tablica korkowa">
    <svg class="strings" id="strings"></svg>
    <div class="hint-toast" id="toast" hidden></div>
  </main>

  <section class="desk">
    <div class="tabs" role="tablist">
      <button class="tab" id="tab-akta" role="tab" aria-selected="true">Akta</button>
      <button class="tab" id="tab-notes" role="tab" aria-selected="false">Notatnik</button>
    </div>
    <div class="sheet" id="sheet" tabindex="0"></div>
    <div class="actions">
      <button class="btn ghost" id="hintBtn">Podpowiedź (3)</button>
      <button class="btn red" id="accuseBtn">Oskarż</button>
    </div>
  </section>

  <div class="overlay" id="accuse" hidden>
    <div class="card" id="accuseCard">
      <h3>Akt oskarżenia</h3>
      <div class="lbl">Sprawca</div>
      <div class="grid" id="pickWho"></div>
      <div class="lbl" id="toolLbl">Narzędzie zbrodni</div>
      <div class="grid" id="pickWhat"></div>
      <div class="msg" id="accuseMsg"></div>
      <div class="foot">
        <button class="btn ghost" id="accuseCancel">Wróć do tablicy</button>
        <button class="btn red" id="accuseGo" disabled>Wnieś oskarżenie</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="newCase" hidden>
    <div class="card">
      <h3>Nowa sprawa</h3>
      <p class="sub">Wybierz miasto, rok i wielkość śledztwa. „Losowo” zostawia wybór generatorowi.</p>
      <div class="lbl">Miasto</div>
      <div class="opts" id="optCity"></div>
      <div class="lbl">Rok</div>
      <div class="opts" id="optYear"></div>
      <div class="lbl">Wielkość</div>
      <div class="opts" id="optSize"></div>
      <div class="foot">
        <button class="btn ghost" id="newCancel">Anuluj</button>
        <button class="btn red" id="newGo">Otwórz sprawę</button>
      </div>
    </div>
  </div>

  <div class="overlay howto" id="howto" hidden>
    <div class="card hw-card" id="hwCard" role="dialog" aria-modal="true" aria-labelledby="hwTitle">
      <div class="hw-top"><span class="hw-step" id="hwStep"></span><button class="hw-skip" id="hwSkip">Pomiń</button></div>
      <div class="hw-stage" id="hwStage" role="img"></div>
      <h3 id="hwTitle"></h3>
      <p class="hw-txt" id="hwTxt"></p>
      <p class="hw-tip" id="hwTip"></p>
      <div class="hw-dots" id="hwDots"></div>
      <div class="foot"><button class="btn ghost" id="hwPrev">Wstecz</button><button class="btn red" id="hwNext">Dalej</button></div>
    </div>
  </div>

  <div class="overlay" id="result" hidden>
    <div class="card" id="resultCard"></div>
  </div>
</div>
<script>
/*
 * Siatka Powiązań — pixel art 12×12.
 * Portrety składane z warstw (twarz, fryzura, nakrycie głowy, ubranie, dodatki),
 * ikony miejsc i przedmiotów z kształtów + palet.
 * '.' = przezroczysty piksel; pozostałe znaki to klucze palety.
 */
(function (root) {
  const E = "............";
  const blank = () => Array.from({ length: 12 }, () => E);

  /* ---------------- PORTRETY ---------------- */
  const FACE = [E, E, E, "...ssssss...", "...sesses...", "...ssssss...", "...ssmmss...", "....ssss....", ".....ss.....", E, E, E];

  const CLOTHES = {
    plain:  { 9: "..cccccccc..", 10: ".cccccccccc.", 11: ".cccccccccc." },
    collar: { 9: "..cddccddc..", 10: ".cccdccdccc.", 11: ".cccccccccc." },
    apron:  { 9: "..cccccccc..", 10: ".ccddddddcc.", 11: ".ccddddddcc." },
    jacket: { 9: "..cccddccc..", 10: ".ccccddcccc.", 11: ".ccccddcccc." }
  };

  const HAIR = {
    m_short: { 1: "...hhhhhh...", 2: "..hhhhhhhh..", 3: "..h......h.." },
    m_bald:  { 3: "..h......h..", 4: "..h......h.." },

<script>
/*
 * Siatka Powiązań — silnik: losowanie, solver, generator spraw.
 * Działa w przeglądarce (window.Siatka) i w Node (require).
 *
 * World = { base: SIATKA_BASE, cities: SIATKA_CITIES }
 *
 * Model logiczny sprawy (pole `facts`):
 *   has_key     {who, where}
 *   presence    {who, where, at}  albo {who, where, from, to}
 *   alibi       {who, from, to, confirmed}
 *   trait       {who, trait, value}
 *   item_origin {what, where}
 *   item_moved  {what, from, to}
 * Reguły (pole `rules`): {id, type: alibi|trait|window|key, trait?, value?, text}

  function hash(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }

    return (h ^= h >>> 16) >>> 0;
  }
  function makeRng(seed) {
    let a = hash(String(seed));
    const next = () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

      next,
      int: (lo, hi) => lo + Math.floor(next() * (hi - lo + 1)),
      pick: arr => arr[Math.floor(next() * arr.length)],
      chance: p => next() < p,
      shuffle: arr => { const a2 = arr.slice(); for (let i = a2.length - 1; i > 0; i--) { const j = Math.floor(next() * (i + 1)); [a2[i], a2[j]] = [a2[j], a2[i]]; } return a2; }
    };

  function indexFacts(c) {
    const ix = { key: new Set(), pres: [], alibi: {}, trait: {}, origin: {}, moved: {}, fate: {}, debunked: new Set() };

  /* reguły o dowodzie: w = kto był na miejscu w czasie zniknięcia, k = kto ma klucz, f = co stało się z dowodem */
  /* d = narzędzie porzucono tam, gdzie sprawca bywa codziennie (łączy akta przedmiotu z aktami osoby) */
  const ITEM_PATTERNS = ["wk", "wk", "w", "k", "wf", "kf", "wd", "kd", "wd", "wkd"];
  const DUMP = ["smietnik", "tory", "park", "budowa", "bazar"];

  function generateCase(world, seed, opts = {}) {
    // miasto, rok i wielkość losujemy raz, żeby ponowne próby nie zmieniały proporcji
    const R0 = makeRng(seed + "/opts");
    opts = Object.assign({}, opts);
    if (!world.cities[opts.city]) opts.city = R0.pick(Object.keys(world.cities));
    if (!opts.year) opts.year = R0.int(world.base.years[0], world.base.years[1]);
    if (!SIZES[opts.size]) opts.size = R0.pick(Object.keys(SIZES));
    for (let attempt = 0; attempt < 200; attempt++) {
      const c = build(world, `${seed}#${attempt}`, opts);
      if (!c) continue;
      const res = solve(c);
      if (res.ok) { c.seed = String(seed); c.verify = { solutions: res.solutions.length, necessary: res.necessary }; return c; }
    }
    throw new Error("Nie udało się wygenerować poprawnej sprawy dla seeda " + seed);
  }

  function build(world, seed, opts) {
    const R = makeRng(seed);
    const B = world.base;

    /* 0. Miasto, rok, wielkość */
    const cityId = opts.city && world.cities[opts.city] ? opts.city : R.pick(Object.keys(world.cities));
    const city = world.cities[cityId];
    const year = opts.year || R.int(B.years[0], B.years[1]);
    const monthIdx = R.int(0, 11);
    const sizeKey = SIZES[opts.size] ? opts.size : R.pick(Object.keys(SIZES));
    const N = SIZES[sizeKey].n, K = R.pick(SIZES[sizeKey].k);
    const milicja = year === 1989 || (year === 1990 && monthIdx < 4);
    const A = list => avail(list, year);

    const streets = R.shuffle(city.streets);
    const V = {
      city: city.name, district: city.district.nom, district_gen: city.district.gen,
      district_na: city.district.na, district_na_cap: cap(city.district.na), district_po: city.district.po,
      street: streets[0], street2: streets[1],
      market_on: city.market.on, market_from: city.market.from, market_to: city.market.to,
      bar: R.pick(city.bars), church_at: city.church_at, team: R.pick(city.teams), cinema: city.cinema, gazeta: city.gazeta,
      dworzec: city.dworzec, szpital: city.szpital, walk: city.walk, uni: city.uni,
      zaklad_at: R.pick(A(city.zaklad_at)),
      month: B.months[monthIdx], year, police_dat: milicja ? "milicji" : "policji", money: money(R, year)
    };
    const T = (s, g, extra) => tx(s, g, extra ? Object.assign({}, V, extra) : V);
    /* w jednej sprawie to samo zdanie nie trafia do dwóch osób (dopóki starcza wariantów) */
    const usedTpl = new Set();
    const pickU = list => { const free = list.filter(x => !usedTpl.has(x)); const c = R.pick(free.length ? free : list); usedTpl.add(c); return c; };
    const asList = x => Array.isArray(x) ? x : [x];

    /* 1. Reguły o dowodzie i układ miejsc */
    const pattern = R.pick(ITEM_PATTERNS);
    const hasW = pattern.includes("w"), hasK = pattern.includes("k"), hasF = pattern.includes("f"), hasD = pattern.includes("d");
    // dwa dowody w jednym miejscu da się rozróżnić tylko godziną zniknięcia albo losem przedmiotu
    const share = K >= 2 && (hasW || hasF || hasD) && R.chance(.5);
    const nLoc = share ? K - 1 : K;

    /* 2. Zbrodnia, podtyp, scena, miejsca i dowody */
    const items = B.items.filter(it => inYears(it, year));
    const cityLocs = (city.locations || []).filter(l => inYears(l, year));
    const allLocs = [...B.locations, ...cityLocs];
    const locIdSet = new Set(allLocs.map(l => l.id));
    const accessOf = role => [...(role.access || []), ...cityLocs.filter(l => (l.roles || []).includes(role.id)).map(l => l.id)];
    const locsFor = (sub, exclude) => {
      const m = {};
      for (const it of items) if (it.tags.includes(sub)) for (const o of it.origins) {
        if (!locIdSet.has(o) || (exclude && exclude.includes(o))) continue;
        (m[o] = m[o] || []).push(it);
      }
      return m;
    };
    const viable = m => Object.keys(m).length >= nLoc && (!share || Object.values(m).some(a => a.length >= 2));
    const combos = [];
    for (const cid of Object.keys(B.crimes)) {
      if (opts.crime && cid !== opts.crime) continue;
      const cr = B.crimes[cid];
      for (const sub of cr.subtags) for (const sc of cr.scenes.filter(s => inYears(s, year)))
        if (viable(locsFor(sub, sc.exclude))) combos.push([cid, sub, sc]);
    }
    if (!combos.length) return null;
    const crimeId = R.pick([...new Set(combos.map(c => c[0]))]);
    const [, sub, scene] = R.pick(combos.filter(c => c[0] === crimeId));
    const crime = B.crimes[crimeId];
    const itemsByLoc = locsFor(sub, scene.exclude);
    const avLoc = Object.keys(itemsByLoc);
    const localAv = avLoc.filter(id => cityLocs.some(l => l.id === id));
    let locs = [];
    if (share) locs.push(R.pick(avLoc.filter(id => itemsByLoc[id].length >= 2)));
    if (localAv.length && R.chance(.6)) { const c = R.pick(localAv.filter(id => !locs.includes(id))); if (c) locs.push(c); }
    locs = locs.concat(R.sample(avLoc.filter(id => !locs.includes(id)), nLoc - locs.length));
    if (locs.length < nLoc) return null;
    const LOCS = locs.map(id => allLocs.find(l => l.id === id));
    // przedmioty: z miejsca dzielonego dwa, z pozostałych po jednym
    const I = [], locOf = [];
    LOCS.forEach((loc, li) => {
      const n = share && li === 0 ? 2 : 1;
      const cand = R.sample(itemsByLoc[loc.id].filter(it => !I.includes(it)), n);
      cand.forEach(it => { I.push(it); locOf.push(li); });
    });
    if (I.length !== K) return null;

    /* 3. Czas: zbrodnia + po jednym 30-minutowym oknie zniknięcia na dowód */
    const C = R.int(18, 21) * 60 + R.pick([0, 30]);
    const crimeWin = [C, C + 30];
    const order = R.shuffle([...Array(K).keys()]);
    const win = [];
    order.forEach((i, p) => { win[i] = [C - 30 * (K + 1) + 30 * p, C - 30 * K + 30 * p]; });
    const inWin = i => { const [a, b] = win[i]; return R.int((a + 5) / 5, (b - 5) / 5) * 5; };
    // poza wszystkimi oknami: przed pierwszym albo po ostatnim, przed zbrodnią
    const outT = () => R.chance(.5) ? C - 30 * (K + 1) - R.int(3, 8) * 5 : C - 30 + R.int(1, 5) * 5;

    /* 4. Sprawca, narzędzie, fałszywe tropy */
    const sameLoc = (a, b) => locOf[a] === locOf[b];
    let wIdx = R.int(0, K - 1);
    if (share && R.chance(.7)) wIdx = R.pick([...Array(K).keys()].filter(i => locOf[i] === 0));
    const herrings = [...Array(K).keys()].filter(i => i !== wIdx);
    const hMethod = {};
    for (const h of herrings) {
      const ok = [];
      if (hasW) ok.push("window");
      if (hasK && !sameLoc(h, wIdx)) ok.push("key");
      if (hasF) ok.push("fate");
      if (hasD) ok.push("dump");
      if (!ok.length) return null;
      hMethod[h] = R.pick(ok);
    }
    const H = new Set(Object.values(hMethod));
    // los przedmiotów
    const fateIds = hasD ? DUMP : Object.keys(B.fates);
    const fateV = R.pick(fateIds);
    const fate = [];
    I.forEach((_, i) => {
      if (i === wIdx) fate[i] = fateV;
      else if (hMethod[i] === "fate" || hMethod[i] === "dump") fate[i] = R.pick(fateIds.filter(f => f !== fateV));
      else fate[i] = R.pick(fateIds);
    });
    // reguła o losie musi coś eliminować: gdy nie odcina sprawcy od tropu, potrzebny trop z innym losem dla któregoś niewinnego
    if (hasF && !H.has("fate")) { const h = R.pick(herrings); fate[h] = R.pick(fateIds.filter(f => f !== fateV)); }

    /* 5. Reguły osobowe: alibi nie zawsze, za to więcej cech */
    const nInn = N - 1;
    const itemRules = [hasW && "window", hasK && "key", hasF && "fate", hasD && "dump"].filter(Boolean);
    const nonH = itemRules.filter(r => !H.has(r)).length;
    let P = nInn - nonH;
    if (P < 1) return null;
    if (P >= 3 && R.chance(.3)) P--;
    P = Math.min(P, MAX_RULES - itemRules.length);
    if (P < 1) return null;
    const useAlibi = R.chance(.6);
    const traitIds = R.sample(TRAITS, useAlibi ? P - 1 : P);
    const rules = [...(useAlibi ? [{ type: "alibi" }] : []), ...itemRules.map(t => ({ type: t, value: t === "fate" ? fateV : undefined })),
      ...traitIds.map(t => ({ type: "trait", trait: t, value: t === "shoe" ? null : R.pick(B.traits[t].ruleValues || B.traits[t].values) }))];
    if (!rules.some(r => r.type === "alibi" || r.type === "trait")) return null;
    const ruleKey = r => r.type === "trait" ? "trait:" + r.trait : r.type;

    /* 6. Podejrzani */
    const S = [...Array(N)].map(() => ({ g: R.chance(.5) ? "m" : "f", keys: new Set(), pres: [], alibi: false, fakeAlibi: false, traits: {} }));
    const cIdx = R.int(0, N - 1);
    const shoeRule = rules.find(r => r.trait === "shoe");
    if (shoeRule) shoeRule.value = R.pick(B.traits.shoe.values[S[cIdx].g]);
    const shoeFits = g => !shoeRule || B.traits.shoe.values[g].includes(shoeRule.value);
    const valuesOf = (t, g) => t === "shoe" ? B.traits.shoe.values[g] : B.traits[t].values;
    const otherVal = (t, v, g) => R.pick(valuesOf(t, g).filter(x => x !== v));
    S.forEach((s, i) => {
      for (const t of TRAITS) {
        const r = rules.find(x => x.trait === t);
        if (r) s.traits[t] = t === "shoe" ? (shoeFits(s.g) ? r.value : R.pick(valuesOf(t, s.g))) : r.value;
        else if (t === "motive") s.traits[t] = i === cIdx ? "yes" : (R.chance(.35) ? "yes" : "no");
        else s.traits[t] = R.pick(valuesOf(t, s.g));
      }
    });
    const satisfyItem = (s, i) => { if (hasW) s.pres.push({ loc: locOf[i], t: inWin(i) }); if (hasK) s.keys.add(locOf[i]); };

    const cul = S[cIdx];
    satisfyItem(cul, wIdx);
    cul.traits.habit = hasD ? fate[wIdx] : R.pick(DUMP);
    for (const h of herrings) {
      if (hMethod[h] === "window") { if (hasK) cul.keys.add(locOf[h]); if (!sameLoc(h, wIdx) && R.chance(.55)) cul.pres.push({ loc: locOf[h], t: outT() }); }
      else if (hMethod[h] === "key") { if (hasW) cul.pres.push({ loc: locOf[h], t: inWin(h) }); }
      // "fate"/"dump": sprawca może mieć wszystko do tropu, bo i tak odpada z reguły o losie
      else if (R.chance(.5) && !sameLoc(h, wIdx)) satisfyItem(cul, h);
    }

    // niewinni: każdy łamie dokładnie jedną regułę; każda reguła spoza H musi kogoś wyeliminować
    const innocents = [...Array(N).keys()].filter(i => i !== cIdx);
    const assign = {}, free = [];
    for (const i of R.shuffle(innocents)) { if (!shoeFits(S[i].g)) assign[i] = shoeRule; else free.push(i); }
    const covered = new Set(Object.values(assign).map(ruleKey));
    const must = R.shuffle(rules.filter(r => !H.has(r.type) && !covered.has(ruleKey(r))));
    if (must.length > free.length) return null;
    must.forEach((r, k) => { assign[free[k]] = r; });
    for (const i of free.slice(must.length)) assign[i] = R.pick(rules);

    const fateOk = i => !hasF || fate[i] === fateV;
    const okTraps = [...Array(K).keys()].filter(fateOk);
    const elim = {};
    for (const sIdx of innocents) {
      const s = S[sIdx], r = assign[sIdx];
      let trap;
      const habitFor = t => { s.traits.habit = hasD ? fate[t] : R.pick(DUMP); };
      if (r.type === "dump") {
        trap = R.pick(okTraps); satisfyItem(s, trap);
        s.traits.habit = R.pick(DUMP.filter(d => d !== fate[trap]));
      } else if (r.type === "fate") {
        // ktoś, kto mógł zabrać przedmiot, ale nie ten, którego los się zgadza
        const c = herrings.filter(h => !fateOk(h) && (hasW || !sameLoc(h, wIdx)));
        if (!c.length) return null;
        trap = R.pick(c); satisfyItem(s, trap); habitFor(trap);
      } else {
        const pool = okTraps.filter(i => i !== wIdx);
        trap = pool.length && R.chance(.7) ? R.pick(pool) : R.pick(okTraps);
        if (r.type === "alibi") { s.alibi = true; satisfyItem(s, trap); }
        else if (r.type === "trait") { s.traits[r.trait] = otherVal(r.trait, r.value, s.g); satisfyItem(s, trap); }
        else if (r.type === "window") { if (hasK) s.keys.add(locOf[trap]); s.pres.push({ loc: locOf[trap], t: outT() }); }
        else if (r.type === "key") { if (hasK && s.keys.has(locOf[trap])) return null; s.pres.push({ loc: locOf[trap], t: hasW ? inWin(trap) : outT() }); }
        habitFor(trap);
      }
      elim[sIdx] = { rule: r, trap };
    }
    // bez reguły o alibi część niewinnych i tak ma świadków (to tylko tło)
    if (!useAlibi) for (const i of innocents) if (R.chance(.35)) S[i].alibi = true;
    /* ZMYŁKA: fałszywe alibi. Brzmi jak potwierdzone, ale obala je zdanie w aktach innej osoby.
       Najczęściej kłamie sprawca, czasem niewinny, który i tak odpada z innego powodu. */
    if (useAlibi && R.chance(.55)) cul.fakeAlibi = true;
    if (useAlibi && R.chance(.3)) { const c = innocents.filter(i => assign[i].type !== "alibi"); if (c.length) S[R.pick(c)].fakeAlibi = true; }

    /* 7. Tożsamości */
    const roles = [...A(B.roles), ...A(city.roles || []), city.worker].filter(r => r && inYears(r, year));
    const usedFirst = new Set(), usedSur = new Set(), usedRoles = new Set(), ids = [];
    const pickName = g => {
      let first; do { first = R.pick(B.names[g]); } while (usedFirst.has(first)); usedFirst.add(first);
      let sur; do { sur = R.pick(B.surnames); } while (usedSur.has(sur[0])); usedSur.add(sur[0]);
      return { first, last: g === "f" ? sur[1] : sur[0] };
    };
    const SP = sprites();
    const persons = S.map((s, idx) => {
      const { first, last } = pickName(s.g);
      const keyLocs = [...s.keys].map(li => LOCS[li].id);
      const fits = role => role[s.g] && !usedRoles.has(role.id);
      const inter = role => accessOf(role).filter(a => locs.includes(a));
      let pool = roles.filter(r => fits(r) && sameSet(inter(r), keyLocs));
      if (!pool.length) pool = roles.filter(r => fits(r) && inter(r).length === 0);
      if (!pool.length) return null;
      const role = R.pick(pool); usedRoles.add(role.id);
      let id = slug(first); while (ids.includes(id)) id += "2"; ids.push(id);
      const hw = (role.headwear && role.headwear[s.g]) || [];
      const head = hw.length ? R.pick(hw) : "";
      return { idx, s, id, first, last, role,
        sprite: { kind: "portrait", g: s.g, skin: R.int(0, 3), hair: R.pick(SP.HAIR_BY_G[s.g]), hairC: R.int(0, 5),
          head: head || null, headC: R.int(0, 4), outfit: role.outfit, glasses: s.traits.glasses === "yes", smoker: s.traits.smoker === "yes",
          mustache: s.g === "m" && R.chance(.35) } };
    });
    if (persons.some(p => !p)) return null;
    const victim = (() => { const n = pickName(scene.vg || "m"); return `${n.first} ${n.last}`; })();

    /* 8. Fakty strukturalne */
    const facts = [];
    const crimeFrom = toHM(crimeWin[0]), crimeTo = toHM(crimeWin[1]);
    persons.forEach(Pp => {
      const s = Pp.s;
      if (hasK) for (const li of s.keys) facts.push({ type: "has_key", who: Pp.id, where: LOCS[li].id });
      for (const p of s.pres) facts.push({ type: "presence", who: Pp.id, where: LOCS[p.loc].id, at: toHM(p.t) });
      facts.push(s.alibi || s.fakeAlibi ? { type: "alibi", who: Pp.id, from: toHM(crimeWin[0] - R.int(2, 6) * 5), to: toHM(crimeWin[1] + R.int(6, 18) * 5), confirmed: true }
                         : { type: "alibi", who: Pp.id, from: toHM(crimeWin[0] - 10), to: toHM(crimeWin[1] + 60), confirmed: false });
      if (s.fakeAlibi) facts.push({ type: "alibi_debunked", who: Pp.id });
      for (const t of [...TRAITS, "habit"]) facts.push({ type: "trait", who: Pp.id, trait: t, value: s.traits[t] });
    });
    I.forEach((it, i) => {
      facts.push({ type: "item_origin", what: it.id, where: LOCS[locOf[i]].id });
      if (hasW) facts.push({ type: "item_moved", what: it.id, from: toHM(win[i][0]), to: toHM(win[i][1]) });
      facts.push({ type: "item_fate", what: it.id, value: fate[i] });
    });

    /* 9. Reguły: kolejność i teksty */
    const sh = R.shuffle(rules);
    sh.forEach((r, k) => { r.id = "r" + (k + 1); r.text = ruleText(B, R, crime, crimeId, scene, r, crimeFrom, crimeTo, T); });

    /* 10. Węzły i teksty dla gracza */
    const nodes = [];
    const debunks = [];
    const motiveRule = rules.some(r => r.trait === "motive");
    const flavorPool = R.shuffle([...A(B.eraFlavor), ...A(city.flavor || [])]);
    const usedLines = new Set();
    const fresh = list => { const c = R.shuffle(list).find(x => !usedLines.has(x)); if (c) usedLines.add(c); return c; };
    persons.forEach(Pp => {
      const s = Pp.s, g = s.g, text = [];
      LOCS.forEach((loc, li) => {
        const parts = [];
        if (hasK && s.keys.has(li)) parts.push(pickU(accessOf(Pp.role).includes(loc.id) ? B.keyTpl : B.spareKeyTpl).replace(/\{gen\}/g, loc.gen));
        for (const p of s.pres.filter(p => p.loc === li)) parts.push(pickU(B.presenceTpl).replace("{in}", loc.in).replace("{t}", toHM(p.t)));
        if (parts.length) text.push(T(parts.join(" "), g));
      });
      const al = facts.find(f => f.type === "alibi" && f.who === Pp.id);
      if (al.confirmed) {
        const a = s.fakeAlibi ? pickU(B.alibiConfirmed.filter(x => x.debunk)) : pickU(B.alibiConfirmed);
        text.push(T(`Od ${al.from} do ${al.to} ${a.text}.`, g) + " " + cap(T(a.witness, g)) + "."); Pp.alibiTxt = T(a.text, g);
        if (s.fakeAlibi) debunks.push({ who: Pp.idx, line: a.debunk });
      }
      else text.push(T(pickU(B.claimFrame).replace("{x}", pickU(A(B.alibiClaim))), g, { from: al.from }));
      for (const r of rules.filter(r => r.type === "trait")) text.push(traitFact(B, crime, pickU, r.trait, s.traits[r.trait], g, year, T));
      if (hasD || R.chance(.25)) text.push(T(pickU(B.habits[s.traits.habit]), g));
      const nTraitRules = rules.filter(r => r.type === "trait").length;
      const decoy = R.pick(TRAITS.filter(t => t !== "motive" && !rules.some(r => r.trait === t)));
      if (decoy && nTraitRules < 3 && R.chance(.6)) text.push(traitFact(B, crime, pickU, decoy, s.traits[decoy], g, year, T));
      // motyw jako tło: gdy nie jest regułą, część osób z motywem dostaje podejrzane zdanie
      if (!motiveRule && s.traits.motive === "yes" && (Pp.idx !== cIdx || R.chance(.5))) text.push(T(pickU(crime.suspicion), g));
      else {
        const l = R.chance(.5) ? fresh(A(Pp.role.flavor || [])) : flavorPool.find(x => !usedLines.has(x));
        if (l && R.chance(nTraitRules >= 3 ? .6 : .85)) { usedLines.add(l); text.push(T(l, g)); }
      }
      nodes.push({ id: Pp.id, type: "person", g, label: `${Pp.first} ${Pp.last.charAt(0)}.`, name: `${Pp.first} ${Pp.last}`, kind: T(Pp.role[g], g), sprite: Pp.sprite, text });
    });
    for (const d of debunks) {
      const others = nodes.filter(n => n.type === "person" && n.id !== persons[d.who].id);
      const n = R.pick(others);
      n.text.splice(Math.min(n.text.length, 2), 0, T(d.line, n.g));
    }
    const holders = li => persons.filter(Pp => Pp.s.keys.has(li)).map(Pp => `${Pp.first} ${Pp.last}`);
    LOCS.forEach((loc, li) => {
      const text = [T(R.pick(loc.desc))];
      const here = I.filter((_, i) => locOf[i] === li);
      if (here.length > 1) text.push(`Tego wieczoru zniknęły stąd dwie rzeczy: ${plList(here.map(it => it.name.toLowerCase()))}.`);
      if (hasK) { const h = holders(li); text.push(h.length ? `${h.length > 1 ? "Klucze mają" : "Klucz ma"} ${plList(h)}. Zamek nieuszkodzony.` : "Nikt z podejrzanych nie ma tu klucza. Zamek nieuszkodzony."); }
      else text.push(T(R.pick(loc.open || ["Drzwi zwykle stoją otwarte, wejść mógł każdy."])));
      nodes.push({ id: loc.id, type: "location", label: loc.label, name: loc.name, kind: "Miejsce", sprite: { kind: "loc", icon: loc.icon }, text,
        forms: [loc.gen, loc.in, loc.from].filter(Boolean) }); // formy do wyróżniania w tekście
    });
    I.forEach((it, i) => {
      const gone = { m: "Zniknął", f: "Zniknęła", n: "Zniknęło" }[it.g];
      const from = LOCS[locOf[i]].from;
      const text = [R.pick(it.desc), hasW ? `${gone} ${from} między ${toHM(win[i][0])} a ${toHM(win[i][1])}.` : `${gone} ${from} tego dnia.`, T(B.fates[fate[i]].item, it.g)];
      nodes.push({ id: it.id, type: "item", g: it.g, label: it.label, name: it.name, kind: "Przedmiot", sprite: { kind: "item", shape: it.icon.shape, pal: it.icon.p }, text });
    });

    /* 11. Połączenia zgodne z faktami, obwód sprawcy */
    const supported = [];
    persons.forEach(Pp => LOCS.forEach((loc, li) => {
      if (Pp.s.keys.has(li) || Pp.s.pres.some(p => p.loc === li)) {
        supported.push([Pp.id, loc.id]);
        I.forEach((it, i) => { if (locOf[i] === li) supported.push([Pp.id, it.id]); });
      }
    }));
    I.forEach((it, i) => supported.push([LOCS[locOf[i]].id, it.id]));
    const C0 = persons[cIdx], wLoc = LOCS[locOf[wIdx]];
    const chain = [[C0.id, wLoc.id], [wLoc.id, I[wIdx].id], [C0.id, I[wIdx].id]];

    /* 12. Podpowiedzi, rozumowanie, epilog */
    const ruleNo = r => r.id.slice(1);
    const hintRules = [...new Set([...innocents.map(i => elim[i].rule), ...rules.filter(r => H.has(r.type))])];
    let hints = R.shuffle(hintRules).map(r => hintText(B, r, ruleNo(r), crimeFrom, crimeTo, hasW));
    if (debunks.length) hints.splice(R.int(0, 1), 0, "Nie każde alibi się trzyma. Porównaj, co mówią o tym samym wieczorze różne osoby.");
    hints = hints.slice(0, 3);
    const why = innocents.map(sIdx => {
      const Pp = persons[sIdx], e = elim[sIdx];
      return [Pp.first, whyText(B, Pp, e, LOCS[locOf[e.trap]], locOf[e.trap], I[e.trap], fate[e.trap], ruleNo(e.rule), hasW, hasK, T)];
    });
    why.push([C0.first, T(`spełnia wszystkie reguły: ${describeCulprit(B, rules, wLoc, hasW, hasK, useAlibi, C0.s.fakeAlibi, T(B.fates[fate[wIdx]].place || ""))}.`, C0.s.g)]);
    const hNames = herrings.map(h => I[h].name.toLowerCase());
    why.push([cap(plList(hNames)), hNames.length > 1
      ? "to fałszywe tropy. Żaden nie pasuje do reguł o tym, skąd, kiedy i przez kogo zniknęło narzędzie."
      : "to fałszywy trop. Nie pasuje do reguł o tym, skąd, kiedy i przez kogo zniknęło narzędzie."]);
    const tTake = C0.s.pres.find(p => p.loc === locOf[wIdx] && p.t >= win[wIdx][0] && p.t <= win[wIdx][1]);
    const sceneTo = T(scene.to);
    const epilogue = T(`${C0.first} ${R.pick(crime.motives)}. ${tTake ? "O " + toHM(tTake.t) : "Tego wieczoru"} [zabrał|zabrała] ${I[wIdx].acc} ${wLoc.from} ${crime.epilogueEnd}`, C0.s.g, { to: sceneTo });

    const vg = scene.vg || "m";
    const intro = [`${V.district}, ${V.city}, ${V.month} ${year}.`, T(scene.intro, vg, { victim }), T(crime.cause[sub], vg), crime.itemsSentence].join(" ");
    const quips = [...B.quips, ...(city.quips || [])];

    return {
      case_id: "case_" + seed.replace(/[^a-z0-9]+/gi, "_"),
      city: cityId, city_name: city.name, district: city.district.nom, year, month: V.month, size: sizeKey,
      crime: crimeId, title: T(scene.title), intro, tool_label: crime.toolLabel,
      time: { crime: { from: crimeFrom, to: crimeTo } },
      nodes, facts, rules: sh.map(r => ({ id: r.id, type: r.type, trait: r.trait, value: r.value, text: r.text })),
      solution: { culprit: C0.id, weapon: I[wIdx].id },
      eliminations: Object.fromEntries(innocents.map(sIdx => [persons[sIdx].id, elim[sIdx].rule.id])),
      red_herrings: herrings.map(h => I[h].id),
      supported_connections: supported, culprit_chain: chain,
      hints, why, epilogue, quip: T(R.pick(quips)),
      detective: milicja ? `Porucznik ${B.detective} z MO` : `Komisarz ${B.detective}`,
      culprit_name: `${C0.first} ${C0.last}`, weapon_name: I[wIdx].name
    };
  }

  /* ---------------- pomocnicze teksty ---------------- */
  function ruleText(B, R, crime, crimeId, scene, r, a, b, T) {
    const pickL = x => R.pick(Array.isArray(x) ? x : [x]);
    if (r.type === "alibi") return pickL(crime.alibiRule).replace("{ev}", crime.alibiEvent).replace("{a}", a).replace("{b}", b);
    if (r.type === "window") return pickL(crime.windowRule);
    if (r.type === "key") return pickL(crime.keyRule);
    if (r.type === "fate") return T(B.fates[r.value].rule, "m");
    if (r.type === "dump") return pickL(B.dumpRule);
    if (r.trait === "motive") return pickL(crime.motiveRule);
    const def = B.traits[r.trait];
    if (r.trait === "hand" && crimeId === "zabojstwo") return pickL(def.ruleMurder[r.value]);
    const tpl = pickL(Array.isArray(def.rule) || typeof def.rule === "string" ? def.rule : def.rule[r.value]);
    return cap(T(tpl, "m", { v: r.value, where: scene.where }));
  }
  function traitFact(B, crime, pickU, trait, value, g, year, T) {
    const def = B.traits[trait];
    if (def.fromCrime) return T(pickU(value === "yes" ? crime.suspicion : crime.noMotive), g);
    const list = avail(Array.isArray(def.facts) ? def.facts : def.facts[value], year);
    return T(pickU(list), g, { v: value });
  }
  function hintText(B, r, n, a, b, hasW) {
    if (r.type === "alibi") return `Reguła ${n}: kto ma potwierdzone alibi na ${a}–${b}?`;
    if (r.type === "window") return `Reguła ${n}: porównaj godziny zniknięcia dowodów z tym, kto i kiedy był na miejscu.`;
    if (r.type === "key") return hasW ? `Reguła ${n}: kto był przy dowodzie we właściwym czasie, ale nie miał klucza?` : `Reguła ${n}: sprawdź, kto ma klucze do których miejsc.`;
    if (r.type === "fate") return `Reguła ${n}: sprawdź w aktach przedmiotów, co się z każdym z nich stało.`;
    if (r.type === "dump") return `Reguła ${n}: porównaj, gdzie znaleziono przedmioty, z tym, gdzie kto bywa codziennie.`;
    const h = B.traits[r.trait].hint; return `Reguła ${n}: ${h.charAt(0).toLowerCase() + h.slice(1)}`;
  }
  function whyText(B, Pp, e, loc, li, item, itemFate, n, hasW, hasK, T) {
    const r = e.rule, g = Pp.s.g;
    if (r.type === "alibi") return T(`ma potwierdzone alibi: ${Pp.alibiTxt} (reguła ${n}).`, g);
    if (r.type === "dump") return T(`[mógł|mogła] zabrać ${item.acc}, ale nie bywa codziennie ${T(B.fates[itemFate].place, g)}, gdzie [go|ją|je] znaleziono (reguła ${n}).`.replace(/\[go\|ją\|je\]/, ["go", "ją", "je"][{ m: 0, f: 1, n: 2 }[item.g]]), g);
    if (r.type === "window") {
      const p = Pp.s.pres.find(x => x.loc === li);
      return T(`${hasK ? `ma klucz do ${loc.gen}, ale ` : ""}[był|była] ${loc.in} o ${toHM(p.t)}, poza czasem zniknięcia dowodów (reguła ${n}).`, g);
    }
    if (r.type === "key") return T(`[był|była] ${loc.in}${hasW ? " we właściwym czasie" : ""}, ale nie ma klucza (reguła ${n}).`, g);
    if (r.type === "fate") return T(`[mógł|mogła] zabrać ${item.acc}, ale ${T(B.fates[itemFate].item, item.g).replace(/\.$/, "").toLowerCase()}, a to nie zgadza się z regułą ${n}.`, g);
    const def = B.traits[r.trait];
    const wf = typeof def.whyFail === "string" ? def.whyFail : def.whyFail[r.value];
    return T(`${wf} (reguła ${n}).`, g, { v: Pp.s.traits[r.trait] });
  }
  function describeCulprit(B, rules, loc, hasW, hasK, useAlibi, fake, dumpPlace) {
    const bits = [];
    if (hasK) bits.push(`ma klucz do ${loc.gen}`);
    if (hasW) bits.push(`[był|była] ${loc.in} we właściwym czasie`);
    if (useAlibi) bits.push(fake ? "[jego|jej] alibi okazało się kłamstwem" : "nie ma alibi");
    for (const r of rules.filter(r => r.type === "trait")) {
      const w = B.traits[r.trait].why;
      bits.push(typeof w === "string" ? w.replace("{v}", r.value) : w[r.value]);
    }
    if (rules.some(r => r.type === "fate")) bits.push("a los narzędzia zgadza się z ustaleniami");
    if (rules.some(r => r.type === "dump")) bits.push(`a narzędzie znaleziono ${dumpPlace}, gdzie [bywa|bywa] codziennie`);
    return bits.join(", ");
  }

  function sprites() {
    if (root.SiatkaSprites) return root.SiatkaSprites;
    if (typeof require !== "undefined") return require("./sprites.js");
    throw new Error("Brak modułu sprites");
  }

  /* ---------------- sprawa dnia ---------------- */
  const EPOCH = Date.UTC(2026, 10, 3); // 3 listopada 2026 = sprawa #1
  /* pon. mała → niedz. ogromna */
  const WEEK_SIZES = ["XL", "S", "S", "M", "M", "L", "L"]; // indeks = getDay(): 0 = niedziela
  function dailyNumber(date = new Date()) {
    const d = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate());
    return Math.floor((d - EPOCH) / 86400000) + 1;
  }
  function dailyCase(world, date = new Date()) {
    const n = dailyNumber(date);
    const c = generateCase(world, "daily-" + n, { size: WEEK_SIZES[date.getDay()] });
    c.number = n; return c;
  }

  const api = { makeRng, tx, solve, generateCase, dailyCase, dailyNumber, SIZES };
  root.Siatka = api;
  if (typeof module !== "undefined" && module.exports) module.exports = api;
})(typeof window !== "undefined" ? window : globalThis);

    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

/* ---------- klocki ---------- */

/* ---------- efekty ---------- */
const SFX = {
  pin(t) { noise(t, 0.03, 0.1, sfxBus, "bandpass", 2600, { Q: 2 }); tone("sine", 230, t, 0.06, 0.1, sfxBus, { fEnd: 110 }); },
  tick(t) { noise(t, 0.012, 0.045, sfxBus, "highpass", 4500); },
  /* szuranie sznurka po korku w trakcie przeciągania; v = 0..1 (szybkość palca) */
  rub(t, v = 0.5) { noise(t, rnd(0.04, 0.07), 0.012 + 0.03 * v, sfxBus, "bandpass", rnd(1700, 2700), { Q: 0.9, attack: 0.012 }); },
  /* sznurek zaczepiony o pinezkę: krótkie, miękkie szurnięcie + ciche stuknięcie */
  attach(t) {
    noise(t, 0.12, 0.06, sfxBus, "bandpass", 2600, { Q: 1, fEnd: 1300, attack: 0.008 });
    tone("sine", 320, t + 0.02, 0.05, 0.035, sfxBus, { fEnd: 190 });
  },
  snip(t) { noise(t, 0.02, 0.28, sfxBus, "highpass", 5200); noise(t + 0.055, 0.025, 0.24, sfxBus, "highpass", 4600); tone("triangle", 1900, t, 0.06, 0.05, sfxBus, { fEnd: 900 }); },
  paper(t) { noise(t, 0.2, 0.1, sfxBus, "bandpass", 900, { Q: 0.7, fEnd: 3800, attack: 0.04 }); },
  type(t) { noise(t, 0.025, 0.22, sfxBus, "bandpass", 1900, { Q: 1.2 }); tone("square", 95, t, 0.03, 0.04, sfxBus, { lp: 900 }); },
  page(t) { [0, 0.07, 0.15].forEach((d, i) => SFX.type(t + d + i * rnd(0, 0.02))); },
  out(t) { tone("sine", 170, t, 0.14, 0.4, sfxBus, { fEnd: 70 }); noise(t, 0.07, 0.25, sfxBus, "lowpass", 900); },
  nope(t) { tone("square", 140, t, 0.07, 0.07, sfxBus, { lp: 700 }); tone("square", 132, t + 0.09, 0.08, 0.07, sfxBus, { lp: 700 }); },
  hint(t) { tone("sine", mtof(69), t, 0.9, 0.12, sfxBus, { attack: 0.01 }); tone("sine", mtof(74), t + 0.12, 1.2, 0.1, sfxBus, { attack: 0.01 }); },
  stamp(t) { tone("sine", 120, t, 0.3, 0.6, sfxBus, { fEnd: 42 }); noise(t, 0.14, 0.4, sfxBus, "lowpass", 500); tone("triangle", 98, t + 0.05, 0.6, 0.07, sfxBus); tone("triangle", 104, t + 0.05, 0.6, 0.07, sfxBus); },
  win(t) {
    tone("sine", 1760, t, 1.6, 0.16, sfxBus); tone("sine", 1760 * 2.76, t, 0.6, 0.04, sfxBus); // dzwonek maszyny
    [62, 65, 69, 72, 76].forEach((m, i) => tone("triangle", mtof(m), t + 0.25 + i * 0.09, 2.2 - i * 0.2, 0.07, sfxBus, { attack: 0.01, lp: 2400 }));
  },
  lose(t) { [62, 60, 58, 57].forEach((m, i) => tone("triangle", mtof(m - 12), t + i * 0.28, 1.1, 0.12, sfxBus, { lp: 900, attack: 0.02 })); }
};
function sfx(name, arg) {
  if (!pref.sfx || !SFX[name] || !ensure()) return;
  try { SFX[name](ctx.currentTime + 0.005, arg); } catch (_) {}
}

/* ---------- muzyka ---------- */
const BEAT = 60 / 62;
const PROG = [ // bas, akord (MIDI); każdy akord trwa 2 takty
  { bass: 38, chord: [53, 57, 60, 64] }, // Dm9
  { bass: 46, chord: [53, 57, 62, 65] }, // B♭maj7
  { bass: 43, chord: [53, 58, 62, 69] }, // Gm9
  { bass: 45, chord: [55, 61, 64, 70] }  // A7♭9
];
const BLUES = [62, 65, 67, 68, 69, 72, 74, 77];
const M = { timer: null, next: 0, step: 0, mel: 3, vinyl: null };

function scheduleBeat(step, t) {
  const bar = Math.floor(step / 4), beat = step % 4, ch = PROG[Math.floor(bar / 2) % PROG.length], first = bar % 2 === 0;
  if (first && beat === 0) ch.chord.forEach((m, i) => tone("triangle", mtof(m), t, BEAT * 8 + 1.6, 0.03, musBus, { attack: 1.1, hold: BEAT * 8 - 1.2, lp: 1000, detune: i % 2 ? 5 : -5 }));
  // kontrabas
  const nextRoot = PROG[Math.floor((bar + 1) / 2) % PROG.length].bass;
  let b = null;
  if (beat === 0) b = ch.bass;
  else if (beat === 2) b = Math.random() < 0.65 ? ch.bass + 7 : ch.bass + 12;
  else if (beat === 3 && !first && Math.random() < 0.5) b = nextRoot + (Math.random() < 0.5 ? 1 : -1);

  if (Math.random() < 0.65) noise(t + BEAT * 2 / 3, 0.09, 0.012, musBus, "highpass", 7000);

  if (Math.random() < (first ? 0.15 : 0.38)) {
    M.mel = Math.max(0, Math.min(BLUES.length - 1, M.mel + [-2, -1, -1, 1, 1, 2][Math.floor(Math.random() * 6)]));
    const swing = Math.random() < 0.5 ? 0 : BEAT * 2 / 3, len = BEAT * rnd(0.7, 1.8);
    tone("sine", mtof(BLUES[M.mel]), t + swing, len, 0.045, musBus, { attack: 0.06, vib: 9, send: echoIn });

  const sr = ctx.sampleRate, len = sr * 4, b = ctx.createBuffer(1, len, sr), d = b.getChannelData(0);

let unlocked = false;

  if (!ensure()) return;
  if (!unlocked) { unlocked = true; if (pref.music) musicOn(); }
}
["pointerdown", "keydown"].forEach(ev => window.addEventListener(ev, unlock, { capture: true, passive: true }));
document.addEventListener("visibilitychange", () => {
  if (!ctx) return;
  if (document.hidden) ctx.suspend(); else if (unlocked) ctx.resume();

window.SiatkaAudio = {
  pref, unlock, sfx,
  setSfx(on) { pref.sfx = !!on; savePref(); },
  setMusic(on) { pref.music = !!on; savePref(); if (on) { unlocked = true; musicOn(); } else musicOff(); }
};
})();

</script>
<script>
/*
 * Siatka Powiązań — interfejs gry (tablica, sznurki, akta, oskarżenie, wynik).
 * Wymaga: engine/sprites.js, engine/engine.js, data/base.js, data/cities.js, js/audio.js
 */
(() => {
const WORLD = { base: window.SIATKA_BASE, cities: window.SIATKA_CITIES };
const { svg: sprite } = window.SiatkaSprites;
const $ = id => document.getElementById(id);
const AU = window.SiatkaAudio || { sfx() {}, setSfx() {}, setMusic() {}, pref: { sfx: false, music: false } };

let CASE, byId, supportedSet, chainKeys, S, META, RICH, els = {};
const key = (a, b) => [a, b].sort().join("|");
const fmt = ms => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };

/* ---------- pamięć przeglądarki ---------- */
const ls = {
  get(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (_) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} }
};
/* Zapis postępu: osobno sprawa dnia i ostatnia losowa. Zapisujemy całą sprawę, nie tylko seed,

const SAVE = { daily: "siatka-save-daily", random: "siatka-save-random", last: "siatka-last" };
function saveNow() {
  clearTimeout(saveT);
  if (!S || !META) return;
  ls.set(SAVE[META.kind], { v: 1, case: CASE, label: S.label, strings: [...S.strings], out: [...S.out], read: [...S.read],
    hints: S.hints, wrong: S.wrong, done: S.done, win: S.win, elapsed: (S.tEnd || Date.now()) - S.t0 });

let saveT;

/* ---------- haptyka ---------- */

const canVibrate = typeof navigator.vibrate === "function";
const iosTap = (() => {
  if (canVibrate) return null;
  const ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (!ios) return null;

  i.type = "checkbox"; i.setAttribute("switch", ""); i.tabIndex = -1;

  l.appendChild(i); document.body.appendChild(l);

}
/* restartuje jednorazową animację CSS na elemencie */
function bounce(el, cls) {
  if (!el || reduced()) return;
  el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
  el.addEventListener("animationend", () => el.classList.remove(cls), { once: true });
}

/* ---------- mikrofakty: godziny, miejsca, klucze, auta ---------- */
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
function buildRich() {
  const locs = new Set();
  CASE.nodes.filter(n => n.type === "location").forEach(n => [n.name, n.label, ...(n.forms || [])].forEach(f => { if (f && f.length > 3) locs.add(f); }));
  const parts = [
    "(?<t>\\d{1,2}:\\d{2})",
    ...(locs.size ? [`(?<l>${[...locs].sort((a, b) => b.length - a.length).map(esc).join("|")})`] : []),
    "(?<k>(?:klucz|kłódk|zamk|alibi|świad)\\p{L}*|zamek)",
    "(?<v>(?:Żuk|Polonez|Maluch|Syren|Trabant|Wartburg|Fiat|Nys)\\p{L}*)"

const rich = s => String(s).replace(RICH, (m, ...a) => {
  const g = a[a.length - 1];
  return `<b class="fx fx-${g.t ? "t" : g.l ? "l" : g.k ? "k" : "v"}">${m}</b>`;
});

/* ---------- ładowanie sprawy ---------- */
function load(c, label, meta, saved) {
  CASE = c; META = meta;
  byId = Object.fromEntries(c.nodes.map(n => [n.id, n]));
  supportedSet = new Set(c.supported_connections.map(([a, b]) => key(a, b)));
  chainKeys = c.culprit_chain.map(([a, b]) => key(a, b));
  S = { strings: new Set(), out: new Set(), read: new Set(), sel: null, tab: "akta", hints: 0, wrong: 0, done: false, win: false,
    t0: Date.now(), tEnd: null, pending: null, pick: { who: null, what: null }, label };
  if (saved) {
    const ok = id => !!byId[id];
    S.strings = new Set((saved.strings || []).filter(k => k.split("|").every(ok)));
    S.out = new Set((saved.out || []).filter(ok)); S.read = new Set((saved.read || []).filter(ok));
    S.hints = saved.hints || 0; S.wrong = saved.wrong || 0; S.done = !!saved.done; S.win = !!saved.win;
    S.t0 = Date.now() - (saved.elapsed || 0); if (S.done) S.tEnd = Date.now();
  }
  buildRich();
  $("caseLine").textContent = `${label} · ${c.city_name}, ${c.year}`;
  buildBoard();
  const nh = Math.min(3, c.hints.length);
  $("hintBtn").disabled = S.done || S.hints >= nh; $("hintBtn").textContent = `Podpowiedź (${nh - S.hints})`;
  $("accuseBtn").textContent = S.done ? "Wynik" : "Oskarż";
  $("result").hidden = true; $("accuse").hidden = true; $("newCase").hidden = true;
  $("clock").textContent = fmt((S.tEnd || Date.now()) - S.t0);
  renderLives(); hideToast(); renderTabs(); renderSheet(); paintCooldown();
  window.scrollTo(0, 0);
  saveNow();
}

/* ---------- tablica: układ zależny od liczby węzłów ---------- */
const board = $("board"), svgEl = $("strings");
function buildBoard() {
  board.querySelectorAll(".node,.pin").forEach(e => e.remove());
  els = {};
  CASE.nodes.forEach(n => {
    const b = document.createElement("button");
    b.className = `node ${n.type === "location" ? "loc" : n.type}${S.read.has(n.id) ? "" : " unread"}${S.out.has(n.id) ? " out" : ""}`;
    b.dataset.node = n.id;
    const r = Math.round((h01(n.id + "r") * 2 - 1) * 3);
    b.style.setProperty("--r", r + "deg");
    b.innerHTML = `<span class="ph">${sprite(n.sprite)}</span><span class="lb">${n.label}</span>`;
    b.setAttribute("aria-label", `${n.name}, otwórz akta`);

    p.className = "pin"; p.dataset.pin = n.id; p.setAttribute("aria-label", `Pinezka: ${n.name}`);
    board.appendChild(p);
    els[n.id] = { card: b, pin: p, r, n };
  });
  requestAnimationFrame(layout);
}
function rowsOf() {
  const of = t => CASE.nodes.filter(n => n.type === t);
  const P = of("person"), rows = [];
  if (P.length <= 4) rows.push(P); else { const h = Math.ceil(P.length / 2); rows.push(P.slice(0, h), P.slice(h)); }
  rows.push(of("location"), of("item"));
  return rows;
}
/* Tablica dostaje wysokość z CSS (cała przestrzeń między nagłówkiem a szufladą).
   Karty mają szerokość z szerokości tablicy, a gdy rzędy nie mieszczą się w pionie, kurczą się
   (do MIN_W). Wolne miejsce w pionie rozkłada się równo między rzędy, a całość jest wyśrodkowana.
   Gdy nawet najmniejsze karty się nie mieszczą, tablica rośnie i strona się przewija. */
const MIN_W = 46, PAD_X = 12, MAX_GAP = 64;
function sizeCards(nodeW) {
  const lbfs = nodeW < 60 ? 8.5 : nodeW < 70 ? 9.5 : nodeW < 82 ? 10.5 : 11.5;
  for (const id in els) {
    // długie pojedyncze słowa (np. „Pogrzebacz”) dostają mniejszą czcionkę zamiast łamania
    const longest = Math.max(...els[id].n.label.split(/\s+/).map(w => w.length));
    const fit = Math.floor((nodeW - 14) / (longest * 0.6) * 10) / 10;
    els[id].card.style.width = nodeW + "px";
    els[id].card.style.setProperty("--lbfs", Math.min(lbfs, fit) + "px");
  }
  return Math.max(...Object.values(els).map(e => e.card.offsetHeight));
}
function layout() {
  if (!CASE) return;
  board.style.minHeight = "";
  const W = board.clientWidth, H = board.clientHeight;
  const rows = rowsOf(), R = rows.length;
  const tight = H < 360, PAD_Y = tight ? 10 : 16, MIN_GAP = tight ? 10 : 16; // niska tablica: ciaśniej
  const maxPer = Math.max(4, ...rows.map(r => r.length));
  let nodeW = Math.round(Math.min(104, (W - PAD_X * 2) / maxPer * 0.84));
  let nodeH = sizeCards(nodeW);
  const room = H - PAD_Y * 2 - MIN_GAP * (R - 1);
  // podpis nie maleje proporcjonalnie do zdjęcia, więc zmniejszamy, aż się zmieści
  for (let i = 0; i < 40 && R * nodeH > room && nodeW > MIN_W; i++) {
    nodeW = Math.max(MIN_W, Math.min(nodeW - 2, Math.floor(nodeW * room / (R * nodeH))));
    nodeH = sizeCards(nodeW);
  }
  const need = R * nodeH + MIN_GAP * (R - 1) + PAD_Y * 2;
  if (need > H) board.style.minHeight = Math.ceil(need) + "px";
  const BH = Math.max(H, need);
  const gap = Math.max(MIN_GAP, Math.min(MAX_GAP, (BH - PAD_Y * 2 - R * nodeH) / Math.max(1, R - 1)));
  let y = (BH - (R * nodeH + gap * (R - 1))) / 2;
  rows.forEach(row => {
    const slot = (W - PAD_X * 2) / row.length;
    row.forEach((n, i) => {
      const free = Math.max(0, slot - nodeW);
      const x = PAD_X + slot * i + free / 2 + (h01(n.id + "x") - .5) * free * .5;
      const yy = y + (h01(n.id + "y") - .5) * Math.min(8, gap / 3);
      els[n.id].card.style.left = Math.round(x) + "px"; els[n.id].card.style.top = Math.round(yy) + "px";
    });

  });

}
function placePins() {
  const br = board.getBoundingClientRect();
  for (const id in els) {
    const { card: c, r } = els[id];
    const rad = r * Math.PI / 180, cx = c.offsetLeft + c.offsetWidth / 2, cy = c.offsetTop + c.offsetHeight / 2, dy = -(c.offsetHeight / 2) + 5;
    const px = cx - dy * Math.sin(rad), py = cy + dy * Math.cos(rad);
    els[id].pin.style.left = px + "px"; els[id].pin.style.top = py + "px"; els[id].pt = { x: px, y: py };
  }

}
/* sznurek zwisa pod własnym ciężarem; m skaluje zwis (animacja „brzdęknięcia”) */

function drawStrings(fresh) {

    h += `<path class="s" data-k="${k}" d="${d}"/><path class="hit" data-k="${k}" d="${d}"><title>Przetnij sznurek</title></path>`; });

function twang(k) {

  const step = now => {
    if (!S.strings.has(k) || !els[a] || !els[b]) return;
    const t = (now - t0) / 1000, m = t > 0.9 ? 1 : 1 - Math.exp(-5.5 * t) * Math.cos(2 * Math.PI * 3.6 * t);

/* Połączyć można tylko węzły różnego typu (osoba, miejsce, przedmiot). To nie zdradza rozwiązania:

/* ---------- gesty: przeciąganie sznurka ---------- */
const SNAP = 44; // promień przyciągania do pinezki (px)
function targetAt(cx, cy, from) {
  const br = board.getBoundingClientRect(), p = { x: cx - br.left, y: cy - br.top };
  let best = null, bd = SNAP;
  for (const id in els) {
    if (!canLink(from, id) || !els[id].pt) continue;
    const d = Math.hypot(els[id].pt.x - p.x, els[id].pt.y - p.y); if (d < bd) { bd = d; best = id; }
  }
  if (best) return { id: best, ok: true, p };
  const under = document.elementFromPoint(cx, cy), el = under && under.closest("[data-node],[data-pin]");
  const id = el ? el.dataset.node || el.dataset.pin : null;

}
let drag = null, raf = 0, lastPt = null;
board.addEventListener("pointerdown", e => {
  const pin = e.target.closest("[data-pin]"); if (!pin || S.done || drag) return;
  e.preventDefault();
  try { pin.setPointerCapture(e.pointerId); } catch (_) {}
  const id = pin.dataset.pin;
  drag = { id, pid: e.pointerId, x: e.clientX, y: e.clientY, moved: false, snap: null };
  bounce(pin, "pop"); AU.sfx("pin"); haptic(8);

});
window.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.pid) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6) {

    if (S.pending) { setPending(null); showCompatible(drag.id); }
  }

});
function dragFrame() {

    if (v > 0.08) AU.sfx("rub", Math.min(1, v / 1.2));

  const t = targetAt(lastPt.x, lastPt.y, drag.id), snap = t.ok ? t.id : null;
  if (snap !== drag.snap) {
    if (drag.snap) els[drag.snap].pin.classList.remove("snap");
    if (snap) { els[snap].pin.classList.add("snap"); AU.sfx("tick"); haptic(4); }
    drag.snap = snap;
  }
  const tmp = $("tmp");
  if (tmp) { tmp.setAttribute("d", pathD(els[drag.id].pt, snap ? els[snap].pt : t.p)); tmp.classList.toggle("on", !!snap); }
}
function endDrag(e, cancelled) {

  const d = drag; drag = null; lastPt = null;
  if (d.snap) els[d.snap].pin.classList.remove("snap");
  const tmp = $("tmp"); if (tmp) { tmp.setAttribute("d", ""); tmp.classList.remove("on"); }

  if (d.moved) {
    const t = targetAt(e.clientX, e.clientY, d.id);
    if (t.ok) connect(d.id, t.id); else refuse(d.id, t.id);

}

.hw-s4 .hw-f{animation:hw-drag 5.5s infinite}
@keyframes hw-drag{0%{opacity:0;translate:47px 21px;scale:1}6%{opacity:1;translate:47px 21px;scale:1}10%{translate:47px 21px;scale:.8}38%{translate:203px 65px;scale:.8}42%{translate:203px 65px;scale:1}50%{translate:203px 65px;scale:.8}78%{translate:123px 119px;scale:.8}82%{opacity:1;translate:123px 119px;scale:1}90%,100%{opacity:0;translate:123px 119px;scale:1}}
.hw-s4 .s1{animation:hw-s1 5.5s infinite}.hw-s4 .s2{animation:hw-s2 5.5s infinite}
@keyframes hw-s1{0%,10%{stroke-dashoffset:1;opacity:1}38%,94%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes hw-s2{0%,50%{stroke-dashoffset:1;opacity:1}78%,94%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.hw-s4 .g1{animation:hw-g1 5.5s infinite}.hw-s4 .g2{animation:hw-g2 5.5s infinite}
@keyframes hw-g1{0%,10%{opacity:0;scale:.5}11%{opacity:.95;scale:.5}24%{opacity:0;scale:1.7}24.5%{opacity:.95;scale:.5}37%{opacity:0;scale:1.7}100%{opacity:0}}
@keyframes hw-g2{0%,50%{opacity:0;scale:.5}51%{opacity:.95;scale:.5}64%{opacity:0;scale:1.7}64.5%{opacity:.95;scale:.5}77%{opacity:0;scale:1.7}100%{opacity:0}}
/* plansza 5: wykluczenie */
.hw-s5 .hw-f{animation:hw-tap5 4.5s infinite}
@keyframes hw-tap5{0%,12%{opacity:0;translate:161px 143px;scale:1}18%{opacity:1;scale:1}26%{scale:.75}32%{scale:1;opacity:1}42%,100%{opacity:0;translate:161px 143px}}
.hw-s5 .gray{animation:hw-gray 4.5s infinite}

@keyframes hw-acc{0%,16%{translate:0 210px;opacity:1}24%{translate:0 -6px}28%,94%{translate:0 0;opacity:1}100%{translate:0 0;opacity:0}}

@keyframes hw-slam{0%,42%{opacity:0;scale:2.4}48%{opacity:1;scale:.9}52%,94%{opacity:1;scale:1}100%{opacity:0}}

@keyframes hw-star{0%,58%{opacity:0;scale:.3}64%{opacity:1;scale:1.3}68%,94%{opacity:1;scale:1}100%{opacity:0}}
`;

let i = 0, after = null, styled = false;
function render() {
  const s = SLIDES[i], stage = $("hwStage");
  stage.className = "hw-stage hw-s" + (i + 1);
  stage.innerHTML = s.scene();
  stage.setAttribute("aria-label", `Ilustracja: ${s.title}`);
  $("hwTitle").textContent = s.title; $("hwTxt").textContent = s.text; $("hwTip").textContent = s.tip;
  $("hwStep").textContent = `Krok ${i + 1} z ${SLIDES.length}`;
  $("hwPrev").disabled = i === 0;
  $("hwNext").textContent = i === SLIDES.length - 1 ? "Do roboty!" : "Dalej";
  $("hwDots").innerHTML = SLIDES.map((x, j) => `<button data-j="${j}" aria-label="Krok ${j + 1}: ${x.title}"${j === i ? ' aria-current="step"' : ""}></button>`).join("");
}
function go(d) {
  const j = i + d;
  if (j < 0) return;
  if (j >= SLIDES.length) return close();
  i = j; AU.sfx("paper"); render();
}
function open(cb) {
  if (!styled) { const st = document.createElement("style"); st.textContent = CSS; document.head.appendChild(st); styled = true; }
  after = cb || null; i = 0; render();
  $("howto").hidden = false; $("hwNext").focus({ preventScroll: true });
}
function close() {
  if ($("howto").hidden) return;
  $("howto").hidden = true;
  try { localStorage.setItem(KEY, "1"); } catch (_) {}
  const cb = after; after = null; if (cb) cb();
}
$("hwNext").onclick = () => go(1);
$("hwPrev").onclick = () => go(-1);
$("hwSkip").onclick = close;
$("hwDots").addEventListener("click", e => { const b = e.target.closest("[data-j]"); if (b) { i = +b.dataset.j; AU.sfx("paper"); render(); } });
document.addEventListener("keydown", e => {
  if ($("howto").hidden) return;
  if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1); else if (e.key === "Escape") close();
});
/* przesunięcie palcem po planszy: w lewo dalej, w prawo wstecz */
let sx = null;
$("hwCard").addEventListener("pointerdown", e => { sx = e.clientX; });
$("hwCard").addEventListener("pointerup", e => {
  if (sx === null) return; const dx = e.clientX - sx; sx = null;
  if (Math.abs(dx) > 50 && !e.target.closest("button")) go(dx < 0 ? 1 : -1);
});

window.SiatkaHowto = {
  open,
  seen() { try { return localStorage.getItem(KEY) === "1"; } catch (_) { return true; } }
};
})();

</script>
